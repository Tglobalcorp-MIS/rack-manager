/* ───────── 儲存：雲端 db，退而求其次存瀏覽器 ───────── */
let db=null,ref=null,writing=false,dirty=false,saveT=null,readOnly=false,lastWritten=null,downloads=null;
const LS='t1-rack-v1';
function setSync(state,text){const s=$('#sync');s.className='sync '+state;s.querySelector('span').textContent=text}
function payload(){return {schema:1,devices:S.devices,log:S.log.slice(0,80),rev:rev,by:clientId,updatedAt:new Date().toISOString()}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(payload()))}catch(_){}}
function save(){
  saveLocal();
  if(!ref||readOnly){if(!ref)setSync('', '僅存於此瀏覽器');return}
  dirty=true;setSync('busy','儲存中…');clearTimeout(saveT);saveT=setTimeout(flush,600);
}
async function flush(){
  if(writing||!dirty||!ref)return;
  writing=true;dirty=false;rev++;
  const body=payload();lastWritten=body.rev+':'+clientId;
  try{await ref.set(clone(body));remoteExists=true;setSync('ok','已儲存到雲端・所有人共用')}
  catch(e){
    if(e&&e.code==='invalid_argument'){readOnly=true;setSync('err','你只有檢視權限，變更不會儲存')}
    else setSync('err','雲端儲存失敗，已暫存在此瀏覽器');
  }
  writing=false;if(dirty)flush();
}
function applyRemote(data){
  if(!data||!Array.isArray(data.devices))return;
  if(data.by===clientId&&(data.rev+':'+data.by)===lastWritten)return;
  if(drag)return setTimeout(()=>applyRemote(data),400);
  S.devices=clone(data.devices);S.log=clone(data.log||[]);rev=Math.max(rev,data.rev||0);
  if(S.sel&&!getDev(S.sel))S.sel=null;
  renderRacks();renderPane();saveLocal();
}
async function initStore(){
  // 先用本機暫存（若有），讓畫面立即可用
  try{const raw=localStorage.getItem(LS);if(raw){const d=JSON.parse(raw);if(Array.isArray(d.devices)&&d.devices.length){S.devices=d.devices;S.log=d.log||[]}}}catch(_){}
  renderRacks({initial:true});renderPane();
  let tries=0;
  while(!(window.claude&&window.claude.use)&&tries<15){await new Promise(r=>setTimeout(r,200));tries++}
  if(!(window.claude&&window.claude.use)){setSync('', '僅存於此瀏覽器');return}
  try{downloads=await window.claude.use('downloads')}catch(_){}
  try{db=await window.claude.use('db')}catch(_){db=null}
  if(!db){setSync('', '僅存於此瀏覽器（未登入或無雲端權限）');return}
  ref=db.doc('racks/t1');
  setSync('busy','連線雲端中…');
  ref.onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    if(!snap.exists){remoteExists=false;setSync('', '雲端尚無資料，第一次編輯後會自動儲存');return}
    remoteExists=true;applyRemote(snap.data());
    if(!writing&&!dirty)setSync('ok','已同步雲端・所有人共用');
  },err=>{setSync('err','雲端連線中斷，變更暫存在此瀏覽器');ref=null});
}

/* ───────── 匯出／匯入 ───────── */
function exportJSON(){
  const data={app:'T1 機房機櫃',schema:1,exportedAt:new Date().toISOString(),devices:S.devices,log:S.log};
  const json=JSON.stringify(data,null,2);
  const d=new Date();const fn=`T1機櫃_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  if(downloads){downloads.save({filename:fn,data:json}).then(()=>toast('已匯出 '+fn)).catch(e=>{if(e&&e.code==='declined')return;showJSON(json)});return}
  showJSON(json);
}
function showJSON(json){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="modal"><div class="dialog"><div class="dhead"><h2>匯出 JSON</h2><button class="btn ghost" data-x aria-label="關閉">✕</button></div><div class="dbody"><div class="sub" style="margin-bottom:8px">此環境無法直接下載檔案。請複製下方內容，另存為 .json 檔備份。</div><textarea class="json" id="jsonOut" readonly>${esc(json)}</textarea></div><div class="dfoot"><button class="btn" data-x>關閉</button><button class="btn primary" id="cpy">複製</button></div></div></div>`;
  root.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>root.innerHTML='');
  root.querySelector('#cpy').onclick=()=>{const ta=root.querySelector('#jsonOut');navigator.clipboard.writeText(ta.value).then(()=>toast('已複製到剪貼簿')).catch(()=>{ta.select();toast('已選取全文，請按 Ctrl+C 複製')})};
}
function importData(text){
  let data;try{data=JSON.parse(text)}catch(_){toast('檔案不是有效的 JSON',true);return}
  const list=Array.isArray(data)?data:data.devices;
  if(!Array.isArray(list)){toast('找不到設備清單（devices）',true);return}
  const clean=list.filter(x=>x&&TYPES[x.type]&&(x.rack==='A'||x.rack==='B')&&x.u>=1&&x.h>=1).map((x,i)=>Object.assign({id:x.id||('i'+i+Date.now().toString(36)),side:'full',face:TYPES[x.type].face,reversed:false,status:'online',ip:'',sn:'',notes:'',model:'',variant:Object.keys(TYPES[x.type].variants)[0],w:defaultW(x.type,x.h)},x));
  confirmBox('匯入設備清單',`<p style="margin:0">檔案內有 <b>${clean.length}</b> 筆有效設備${list.length!==clean.length?`（略過 ${list.length-clean.length} 筆格式不符）`:''}。匯入會取代目前兩座機櫃的內容，之後仍可按「復原」還原。</p>`,'取代並匯入',()=>{
    snapshot();S.devices=clean;S.sel=null;commit(`匯入 ${clean.length} 筆設備`);toast(`已匯入 ${clean.length} 筆設備`);
  });
}

/* ───────── 事件 ───────── */
function bind(){
  const room=$('#room');
  $('#scene').addEventListener('pointerdown',onDown);
  $('#scene').addEventListener('contextmenu',e=>{if(S.mode==='3d')e.preventDefault()});
  $('#scene').addEventListener('wheel',e=>{if(S.mode!=='3d')return;e.preventDefault();setZoomK(cam.k*Math.exp(-e.deltaY*.0012))},{passive:false});
  $('#m2d').onclick=()=>setMode('2d');$('#m3d').onclick=()=>setMode('3d');
  $('#tSpin').onclick=e=>{S.autorot=!S.autorot;e.currentTarget.setAttribute('aria-pressed',S.autorot)};
  $('#tReset').onclick=()=>{cam.yaw=(S.view==='rear'?180:0)-30;cam.pitch=-14;cam.k=.68;cam.px=0;cam.py=0;applyCam(true);fit()};
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',()=>{if(drag){clearDrop();drag.float&&drag.float.remove();for(const fc of ['front','rear']){const x=devEls.get(drag.id+'|'+fc);x&&x.classList.remove('dragging')}drag=null}});
  room.addEventListener('pointerleave',hideTip);
  room.addEventListener('click',e=>{
    if(orbMoved)return;
    const lb=e.target.closest('.lb');if(lb){select(lb.dataset.id);return}
    const slot=e.target.closest('.slot');if(slot){const bay=slot.closest('.bay');openAdd({rack:bay.dataset.rack,u:+slot.dataset.u});return}
  });
  room.addEventListener('keydown',e=>{if(e.key==='Enter'){const el=e.target.closest('.dev');el&&select(el.dataset.id)}});
  $('#vFront').onclick=()=>setView('front');$('#vRear').onclick=()=>setView('rear');
  $('#addBtn').onclick=()=>openAdd({rack:(S.sel&&getDev(S.sel)?.rack)||'A'});
  $('#undoBtn').onclick=undo;
  let qT;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value.trim();renderRacks();if(S.tab==='list')renderPane()},120)});
  $('#tLabels').onclick=e=>{S.labels=!S.labels;e.currentTarget.setAttribute('aria-pressed',S.labels);fit();pref()};
  $('#tDoor').onclick=e=>{S.door=!S.door;e.currentTarget.setAttribute('aria-pressed',S.door);$('#room').classList.toggle('doors-closed',S.door)};
  $('#tHeat').onclick=e=>{S.heat=!S.heat;e.currentTarget.setAttribute('aria-pressed',S.heat);$('#room').classList.toggle('heat',S.heat)};
  $('#zoomR').oninput=e=>{S.zoom=+e.target.value;$('#zoomAuto').setAttribute('aria-pressed','false');fit()};
  $('#zoomAuto').onclick=()=>{S.zoom=null;$('#zoomAuto').setAttribute('aria-pressed','true');fit()};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  $('#expBtn').onclick=exportJSON;
  $('#impBtn').onclick=()=>{
    const root=$('#modalRoot');
    root.innerHTML=`<div class="modal"><div class="dialog"><div class="dhead"><h2>匯入 JSON</h2><button class="btn ghost" data-x aria-label="關閉">✕</button></div><div class="dbody"><div class="sub" style="margin-bottom:8px">選擇之前匯出的 .json 檔，或把內容貼在下方。</div><button class="btn" id="pick">選擇檔案</button><textarea class="json" id="jsonIn" style="margin-top:10px;min-height:180px" placeholder='{"devices":[...]}'></textarea>
      <div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="sub">或</span><button class="btn danger" id="resetSeed">重設為原始盤點清單</button></div></div>
      <div class="dfoot"><button class="btn" data-x>取消</button><button class="btn primary" id="doImp">匯入貼上的內容</button></div></div></div>`;
    root.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>root.innerHTML='');
    root.querySelector('#pick').onclick=()=>$('#impFile').click();
    root.querySelector('#doImp').onclick=()=>{const v=root.querySelector('#jsonIn').value;root.innerHTML='';importData(v)};
    root.querySelector('#resetSeed').onclick=()=>confirmBox('重設為原始盤點','<p style="margin:0">兩座機櫃會回到 2026/10/16 現場盤點的 45 筆設備，目前的調整會被取代（可按「復原」還原）。</p>','重設',()=>{snapshot();S.devices=seedDevices();S.sel=null;commit('重設為原始盤點清單');toast('已重設為原始盤點')},true);
  };
  $('#impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$('#modalRoot').innerHTML='';importData(rd.result)};rd.readAsText(f);e.target.value=''};
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,textarea,select')||$('#modalRoot').children.length)return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
    if(e.key==='v'||e.key==='V'){setView(S.view==='front'?'rear':'front');return}
    if(e.key==='Escape'){select(null);return}
    if(!S.sel&&S.mode==='3d'&&e.key.startsWith('Arrow')){e.preventDefault();if(e.key==='ArrowLeft')cam.yaw-=10;if(e.key==='ArrowRight')cam.yaw+=10;if(e.key==='ArrowUp')cam.pitch=Math.max(-80,cam.pitch-6);if(e.key==='ArrowDown')cam.pitch=Math.min(60,cam.pitch+6);applyCam(true);return}
    if(!S.sel)return;
    const d=getDev(S.sel);
    const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
    if(map[e.key]){e.preventDefault();nudge(map[e.key],e.shiftKey);return}
    if(e.key==='f'||e.key==='F'){const o=['front','rear','both'];moveDev(d.id,{face:o[(o.indexOf(d.face)+1)%3]});return}
    if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeDev(d.id)}
  });
  window.addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fit,80)});
  // 類型篩選
  const used=[...new Set(S.devices.map(d=>d.type))];
  $('#typeChips').innerHTML=Object.keys(TYPES).filter(t=>['server','storage','switch','firewall','patch','pdu'].includes(t)).map(t=>`<button class="chip" data-type="${t}" aria-pressed="false"><i class="dot" style="background:${TYPES[t].color}"></i>${TYPES[t].label}</button>`).join('');
  $('#typeChips').querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.typeFilter=S.typeFilter===b.dataset.type?null:b.dataset.type;$('#typeChips').querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.type===S.typeFilter));renderRacks();if(S.tab==='list')renderPane()});
}
function pref(){try{localStorage.setItem('t1-rack-pref',JSON.stringify({labels:S.labels}))}catch(_){}}
function loadPref(){try{const p=JSON.parse(localStorage.getItem('t1-rack-pref')||'{}');if(p.labels===false){S.labels=false;$('#tLabels').setAttribute('aria-pressed','false')}}catch(_){}}

/* ───────── 開機 ───────── */
buildRooms();loadPref();bind();
let m0='3d';try{m0=localStorage.getItem('t1-rack-mode')||'3d'}catch(_){}
setMode(m0);spinLoop();
initStore();
// 開機動畫：指示燈由上而下依序亮起
requestAnimationFrame(()=>{document.querySelectorAll('.room .dev').forEach(el=>el.classList.add('boot'));setTimeout(()=>document.querySelectorAll('.room .dev.boot').forEach(el=>el.classList.remove('boot')),4000)});
window.claude?.hot?.snapshot?.(()=>({view:S.view,sel:S.sel}));
})();
</script>
